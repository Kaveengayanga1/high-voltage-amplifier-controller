<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640"><rect width="1000" height="640" fill="white"/><text x="500" y="38" font-family="Arial" font-size="22" text-anchor="middle" fill="black" font-weight="bold">Signal Input Conditioning  —  ±10 V  →  0.15–3.15 V  (PA0)</text><line x1="320" y1="130" x2="650" y2="130" stroke="black" stroke-width="3"/><text x="312" y="136" font-family="Arial" font-size="18" text-anchor="end" fill="black" font-weight="bold">+3.3 V</text><line x1="90" y1="490" x2="650" y2="490" stroke="black" stroke-width="3"/><line x1="460" y1="490" x2="460" y2="504" stroke="black" stroke-width="2.2"/><line x1="442" y1="504" x2="478" y2="504" stroke="black" stroke-width="2.2"/><line x1="448" y1="511" x2="472" y2="511" stroke="black" stroke-width="2.2"/><line x1="454" y1="518" x2="466" y2="518" stroke="black" stroke-width="2.2"/><text x="488" y="516" font-family="Arial" font-size="16" text-anchor="start" fill="black" font-weight="bold">GND</text><circle cx="110" cy="310" r="30" fill="none" stroke="black" stroke-width="2.2"/><path d="M 94 310 q 8 -14 16 0 q 8 14 16 0" fill="none" stroke="black" stroke-width="2.2"/><text x="110" y="238" font-family="Arial" font-size="15" text-anchor="middle" fill="black" font-weight="normal">FUNCTION GENERATOR</text><text x="110" y="258" font-family="Arial" font-size="15" text-anchor="middle" fill="black" font-weight="normal">±10 V max</text><line x1="110" y1="340" x2="110" y2="490" stroke="black" stroke-width="2.2"/><circle cx="110" cy="490" r="4.5" fill="black"/><line x1="140" y1="310" x2="180" y2="310" stroke="black" stroke-width="2.2"/><polyline points="180.0,310.0 195.0,310.0 200.8,297.0 212.5,323.0 224.2,297.0 235.8,323.0 247.5,297.0 259.2,323.0 265.0,310.0 280.0,310.0" fill="none" stroke="black" stroke-width="2.2"/><text x="230" y="284" font-family="Arial" font-size="17" text-anchor="middle" fill="#1a3fa0" font-weight="normal">R1  10 kΩ</text><line x1="280" y1="310" x2="720" y2="310" stroke="black" stroke-width="2.2"/><text x="545" y="296" font-family="Arial" font-size="16" text-anchor="middle" fill="black" font-weight="bold">node A</text><polyline points="360.0,130.0 360.0,158.0 347.0,168.3 373.0,189.0 347.0,209.7 373.0,230.3 347.0,251.0 373.0,271.7 360.0,282.0 360.0,310.0" fill="none" stroke="black" stroke-width="2.2"/><text x="382" y="215" font-family="Arial" font-size="17" text-anchor="start" fill="#1a3fa0" font-weight="normal">R3  3.0 kΩ</text><circle cx="360" cy="130" r="4.5" fill="black"/><circle cx="360" cy="310" r="4.5" fill="black"/><polyline points="360.0,310.0 360.0,338.0 347.0,348.3 373.0,369.0 347.0,389.7 373.0,410.3 347.0,431.0 373.0,451.7 360.0,462.0 360.0,490.0" fill="none" stroke="black" stroke-width="2.2"/><text x="338" y="405" font-family="Arial" font-size="17" text-anchor="end" fill="#1a3fa0" font-weight="normal">R2  4.3 kΩ</text><circle cx="360" cy="490" r="4.5" fill="black"/><line x1="480" y1="310" x2="480" y2="388" stroke="black" stroke-width="2.2"/><line x1="460" y1="388" x2="500" y2="388" stroke="black" stroke-width="3"/><line x1="460" y1="402" x2="500" y2="402" stroke="black" stroke-width="3"/><line x1="480" y1="402" x2="480" y2="490" stroke="black" stroke-width="2.2"/><circle cx="480" cy="310" r="4.5" fill="black"/><circle cx="480" cy="490" r="4.5" fill="black"/><text x="508" y="380" font-family="Arial" font-size="17" text-anchor="start" fill="#1a3fa0" font-weight="normal">C1</text><text x="508" y="400" font-family="Arial" font-size="17" text-anchor="start" fill="#1a3fa0" font-weight="normal">2.2 nF</text><line x1="610" y1="130" x2="610" y2="204.0" stroke="black" stroke-width="2.2"/><line x1="610" y1="236.0" x2="610" y2="310" stroke="black" stroke-width="2.2"/><polygon points="594,236.0 626,236.0 610,204.0" fill="none" stroke="black" stroke-width="2.2"/><line x1="594" y1="204.0" x2="626" y2="204.0" stroke="black" stroke-width="3"/><text x="636" y="218" font-family="Arial" font-size="17" text-anchor="start" fill="#1a3fa0" font-weight="normal">D1  1N4148</text><circle cx="610" cy="130" r="4.5" fill="black"/><circle cx="610" cy="310" r="4.5" fill="black"/><line x1="610" y1="310" x2="610" y2="384.0" stroke="black" stroke-width="2.2"/><line x1="610" y1="416.0" x2="610" y2="490" stroke="black" stroke-width="2.2"/><polygon points="594,416.0 626,416.0 610,384.0" fill="none" stroke="black" stroke-width="2.2"/><line x1="594" y1="384.0" x2="626" y2="384.0" stroke="black" stroke-width="3"/><text x="636" y="408" font-family="Arial" font-size="17" text-anchor="start" fill="#1a3fa0" font-weight="normal">D2  1N4148</text><circle cx="610" cy="490" r="4.5" fill="black"/><circle cx="720" cy="310" r="6" fill="white" stroke="black" stroke-width="2.2"/><text x="736" y="316" font-family="Arial" font-size="18" text-anchor="start" fill="black" font-weight="bold">PA0  (ADC1_IN0)</text><text x="90" y="560" font-family="Arial" font-size="15" text-anchor="start" fill="#444" font-weight="normal">All resistors 1/4 W, 1% metal film (THT).  C1: ceramic disc, code 222.  D1/D2: 1N4148 silicon diodes.</text><text x="90" y="583" font-family="Arial" font-size="15" text-anchor="start" fill="#444" font-weight="normal">D1 clamps node above ≈ 4.0 V, D2 clamps below ≈ −0.7 V.  R1 limits fault current to ~1 mA — within STM32 injection spec.</text><text x="90" y="606" font-family="Arial" font-size="15" text-anchor="start" fill="#444" font-weight="normal">Normal signals never reach the clamp points (max 3.18 V worst-case), so the diodes are invisible in operation.</text></svg>